# Render blueprint for the whole monorepo.
#
# Two independent services, each built from its own folder via `rootDir`:
#
#   keyword-analyzer-api   — the FastAPI backend   (backend/)
#   keyword-analyzer-web   — the static frontend   (frontend/)
#
# They are wired to each other with `fromService`, so you do NOT need to know
# either URL in advance:
#
#   * the web service receives the API's hostname as API_BASE_URL, which
#     frontend/build.sh turns into config.js at build time;
#   * the API receives the web service's hostname as ALLOWED_ORIGINS, which
#     the backend promotes to https://<host> for CORS and the API-key gate.
#
# `sync: false` marks a secret: Render prompts for it on first deploy and
# never stores it in this file or in git.

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: keyword-analyzer-api
    runtime: python
    plan: starter
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ---- Mode ----
      - key: MODE
        value: prod

      # ---- Access ----
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # secret
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: API_KEY
        sync: false          # secret
      # The frontend service's hostname. The backend promotes a bare host to
      # https://<host>, so this works with no scheme.
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: keyword-analyzer-web
          property: host

      # ---- AI ----
      # Three providers, tried in order. At least one key must be set; an
      # unset provider is skipped rather than failing the chain.
      - key: AI_PROVIDER_ORDER
        value: anthropic,openai,gemini
      - key: AI_TIMEOUT_SECONDS
        value: "120"
      - key: MAX_KEYWORDS_IN_PROMPT
        value: "600"
      - key: ANTHROPIC_API_KEY
        sync: false          # secret
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: OPENAI_API_KEY
        sync: false          # secret
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: GEMINI_API_KEY
        sync: false          # secret
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

      # ---- Collection ----
      - key: SUGGEST_LANG
        value: en
      - key: SUGGEST_COUNTRY
        value: us
      - key: SUGGEST_DELAY_SECONDS
        value: "1.0"
      - key: SUGGEST_TIMEOUT_SECONDS
        value: "5.0"
      - key: SUGGEST_MAX_RETRIES
        value: "2"
      - key: SUGGEST_QUESTION_MODIFIERS
        value: who,what,when,where,why,how
      - key: SUGGEST_COMMERCIAL_MODIFIERS
        value: best,buy,cheap,near me

      # ---- Limits and logging ----
      - key: RATE_LIMIT_MAX_SEARCHES
        value: "10"
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: "60"
      - key: CACHE_TTL_MINUTES
        value: "1440"
      - key: CACHE_MAX_ENTRIES
        value: "50"
      - key: LOG_LEVEL
        value: INFO

  # --------------------------------------------------------------- frontend
  - type: web
    name: keyword-analyzer-web
    runtime: static
    plan: starter
    branch: main
    rootDir: frontend
    buildCommand: ./build.sh
    staticPublishPath: .
    envVars:
      # The API service's hostname; build.sh promotes it to https://<host>.
      - key: API_BASE_URL
        fromService:
          type: web
          name: keyword-analyzer-api
          property: host
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # config.js is regenerated per deploy; never let a browser cache it.
      - path: /config.js
        name: Cache-Control
        value: no-store
